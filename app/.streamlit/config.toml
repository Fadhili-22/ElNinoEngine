# technical editorial look: pale grey page, white cards, IBM Plex fonts
# (streamlit 1.67 loads the fonts from the google fonts urls below, so no css @import is needed)
[theme]
base = "light"
primaryColor = "#1f4fa8"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#5b6470"
borderColor = "#e2e5e9"
baseRadius = "0.75rem"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"

[client]
# hides the deploy button and the menu
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
