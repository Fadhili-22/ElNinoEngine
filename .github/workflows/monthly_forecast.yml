# Monthly flood forecast: downloads the public data, runs src/update_forecast.py and commits the forecast files to the main branch.
# When it runs (16:17 UTC = 19:17 in Nairobi; the afternoon is after NOAA posted the DMI on 5 Nov, and the odd minute avoids the busy start of the hour):
#   the 5th : WFP posts the last 10 days of the month on about the 3rd, NOAA posts the ONI by the 5th and the DMI on about the first Thursday, so most months everything is ready
#   the 7th and the 10th: the same job again, to catch a source that was late (a run that finds nothing new makes no commit)
#   the 25th: WFP replaces the preliminary rainfall of the last month with the final CHIRPS values on about the 23rd
# It also runs whenever the "Run workflow" button of the Actions tab is pressed.
name: Monthly flood forecast

on:
  schedule:
    - cron: '17 16 5 * *'
    - cron: '17 16 7 * *'
    - cron: '17 16 10 * *'
    - cron: '17 16 25 * *'
  workflow_dispatch:

# the job needs to push the new forecast files
permissions:
  contents: write

# two runs at the same time would try to commit the same files
concurrency:
  group: monthly-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # everything (this file, the code, the model, the forecast files and the app) is on main, which is also the branch
      # that Streamlit Community Cloud deploys, so a new forecast commit refreshes the app by itself
      - name: Get the repository (main branch)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-forecast.txt

      # only the packages that src/update_forecast.py needs (the app has its own app/requirements.txt)
      - name: Install the packages
        run: pip install -r requirements-forecast.txt

      # downloads WFP rainfall and NDVI (HDX) and NOAA ONI and DMI, then makes the forecast.
      # If a source has not published the newest month yet, the forecast is made for the newest month that all of them have.
      - name: Download the data and make the forecast
        run: python src/update_forecast.py --download

      # only the forecast files are committed, and only if they changed
      - name: Commit the forecast files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/forecast/latest_forecast.csv app/forecast/archive
          if git diff --cached --quiet; then
            echo "The forecast did not change, nothing to commit."
          else
            month=$(python -c "import pandas as pd; d = pd.read_csv('app/forecast/latest_forecast.csv'); print(f'{d.forecast_year[0]}-{d.forecast_month[0]:02d}')")
            git commit -m "Update flood forecast for $month"
            # if someone pushed to main while this job was running, put our commit on top of theirs
            git pull --rebase origin main
            git push origin main
          fi
